name: game-portal
services:
  game-portal:
    image: ${GAME_PORTAL_IMAGE:-game-portal:local}
    platform: linux/amd64
    pull_policy: never
    build:
      context: .
      args:
        BUILD_VERSION: ${BUILD_VERSION:-0.1.0}
        SOURCE_COMMIT: ${SOURCE_COMMIT:-unknown}
    environment:
      BASE_URL: /portal
      Portal__Enabled: "true"
      Mahjong__AllowHttpLoopbackOrigin: "true"
    ports:
      - "127.0.0.1:${GAME_PORTAL_HOST_PORT:-8912}:8080"
    volumes:
      - portal-data:/data
    restart: unless-stopped
    stop_grace_period: 30s
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  portal-data:
