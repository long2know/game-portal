name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_VERSION: 0.1.0
  SOURCE_COMMIT: ${{ github.sha }}

jobs:
  application:
    name: .NET and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          package-manager-cache: false
      - name: Build TypeScript and Vite assets
        run: |
          npm --prefix web ci
          npm --prefix web run build
      - name: Test the rules engines and server with locked dependencies
        run: |
          dotnet test tests/Mahjong.Rules.Tests/Mahjong.Rules.Tests.csproj -c Release -p:RestoreLockedMode=true \
            -- RunConfiguration.TreatNoTestsAsError=true
          dotnet test tests/Mahjong.Server.Tests/Mahjong.Server.Tests.csproj -c Release -p:RestoreLockedMode=true \
            -- RunConfiguration.TreatNoTestsAsError=true
          dotnet test tests/JadeCourt.Games.Tests/JadeCourt.Games.Tests.csproj -c Release -p:RestoreLockedMode=true \
            -- RunConfiguration.TreatNoTestsAsError=true
          dotnet test tests/JadeCourt.Chess.Tests/JadeCourt.Chess.Tests.csproj -c Release -p:RestoreLockedMode=true \
            -- RunConfiguration.TreatNoTestsAsError=true
          dotnet test tests/JadeCourt.Poker.Tests/JadeCourt.Poker.Tests.csproj -c Release -p:RestoreLockedMode=true \
            -- RunConfiguration.TreatNoTestsAsError=true
          dotnet test tests/JadeCourt.Solo.Tests/JadeCourt.Solo.Tests.csproj -c Release -p:RestoreLockedMode=true \
            -- RunConfiguration.TreatNoTestsAsError=true
          dotnet test tests/JadeCourt.Words.Tests/JadeCourt.Words.Tests.csproj -c Release -p:RestoreLockedMode=true \
            -- RunConfiguration.TreatNoTestsAsError=true
      - name: Publish the server with built assets
        run: |
          dotnet publish src/Mahjong.Server/Mahjong.Server.csproj -c Release --no-restore -o artifacts/publish \
            -p:UseAppHost=false -p:ContinuousIntegrationBuild=true \
            -p:Version="$BUILD_VERSION" -p:InformationalVersion="$BUILD_VERSION+$SOURCE_COMMIT" \
            -p:IncludeSourceRevisionInInformationalVersion=false
      - name: Install pinned Playwright browsers and their system dependencies
        working-directory: web
        run: ./node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Run Chromium and WebKit against the published app and verify offline restore
        env:
          Portal__Enabled: 'false'
          ASPNETCORE_ENVIRONMENT: Testing
          Mahjong__Testing__BotDelayMilliseconds: '100'
          Mahjong__Testing__TurnSeconds: '30'
          Mahjong__Testing__ClaimSeconds: '8'
        run: bash scripts/smoke-published.sh artifacts/publish "$BUILD_VERSION" "$SOURCE_COMMIT" --with-browser
      - name: Verify runtime subpath hosting against the same published app
        env:
          Portal__Enabled: 'false'
          SMOKE_PATH_BASE: /mahjong
          SMOKE_PLAYWRIGHT_OUTPUT_DIR: test-results/mounted
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/mounted
        run: bash scripts/smoke-published.sh artifacts/publish "$BUILD_VERSION" "$SOURCE_COMMIT" --with-browser
      - name: Verify mounted portal and fallback bot with Chromium and WebKit
        env:
          Portal__Enabled: 'true'
          SMOKE_PATH_BASE: /portal
          SMOKE_PLAYWRIGHT_OUTPUT_DIR: test-results/portal
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/portal
        run: bash scripts/smoke-published.sh artifacts/publish "$BUILD_VERSION" "$SOURCE_COMMIT" --with-browser
      - name: Verify the custom portal mount with trusted loopback TLS
        env:
          Portal__Enabled: 'true'
          SMOKE_PATH_BASE: /game-portal
          SMOKE_HTTPS: 'true'
        run: bash scripts/smoke-published.sh artifacts/publish "$BUILD_VERSION" "$SOURCE_COMMIT"
      - name: Preserve browser evidence and failure logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-evidence
          path: |
            web/playwright-report/
            web/test-results/
            artifacts/infra-smoke-*/*.log
          if-no-files-found: warn
          retention-days: 7

  image:
    name: Runtime image, gameplay and persistence
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GAME_PORTAL_IMAGE: game-portal:ci
    outputs:
      image_id: ${{ steps.candidate.outputs.image_id }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      archive_tag: ${{ steps.archive.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          package-manager-cache: false
      - name: Validate the local and production Compose configurations
        run: |
          docker compose --env-file /dev/null config --quiet
          DOCKER_DATA=/example docker compose --env-file /dev/null -f compose.production.yaml config --quiet
      - name: Build and smoke-test the exact image
        id: candidate
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ || "$(git rev-parse HEAD)" != "$SOURCE_COMMIT" ]]; then
            echo 'The checkout does not match the full workflow commit SHA.' >&2
            exit 1
          fi
          docker build --platform linux/amd64 --load --provenance=false --tag "$GAME_PORTAL_IMAGE" \
            --build-arg BUILD_VERSION="$BUILD_VERSION" --build-arg SOURCE_COMMIT="$SOURCE_COMMIT" .
          image_id=$(docker image inspect --format '{{.Id}}' "$GAME_PORTAL_IMAGE")
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          bash scripts/smoke-container.sh "$image_id" "$BUILD_VERSION" "$SOURCE_COMMIT"
          printf 'image_id=%s\n' "$image_id" >> "$GITHUB_OUTPUT"
      - name: Export the tested image for the release jobs
        id: archive
        if: >-
          github.event_name == 'push' && github.server_url == 'https://github.com' &&
          github.repository == 'long2know/game-portal' && github.ref == 'refs/heads/main'
        env:
          TESTED_IMAGE_ID: ${{ steps.candidate.outputs.image_id }}
        run: |
          bash scripts/smoke-image-archive.sh save release-image "$TESTED_IMAGE_ID" "$SOURCE_COMMIT"
          printf 'tag=portal-image-%s-%s-%s\n' "$SOURCE_COMMIT" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Transfer the tested archive without rebuilding
        id: upload
        if: ${{ steps.archive.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.archive.outputs.tag }}
          path: release-image/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish the verified GHCR image
    needs: [application, image]
    if: >-
      github.event_name == 'push' && github.server_url == 'https://github.com' &&
      github.repository == 'long2know/game-portal' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: ghcr-game-portal-latest
      queue: max
    permissions:
      contents: read
      packages: write
    outputs:
      visibility: ${{ steps.registry.outputs.visibility }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.image.outputs.artifact_id }}
          path: release-image/
      - name: Load the exact tested candidate
        env:
          TESTED_IMAGE_ID: ${{ needs.image.outputs.image_id }}
        run: bash scripts/smoke-image-archive.sh load release-image "$TESTED_IMAGE_ID" "$SOURCE_COMMIT"
      - name: Advance GHCR latest and distinguish private from public
        id: registry
        env:
          GHCR_TOKEN: ${{ github.token }}
          TESTED_IMAGE_ID: ${{ needs.image.outputs.image_id }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SERVER_URL" == https://github.com && "$GITHUB_REPOSITORY" == long2know/game-portal &&
            "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main && "$SOURCE_COMMIT" == "$GITHUB_SHA" ]]
          current_main() {
            GIT_TERMINAL_PROMPT=0 git -c credential.helper= ls-remote --exit-code \
              https://github.com/long2know/game-portal.git refs/heads/main | cut -f1
          }
          main_commit=$(current_main)
          if [[ "$main_commit" != "$SOURCE_COMMIT" ]]; then
            echo "Skipping publication: main is now $main_commit."
            exit 0
          fi

          image=ghcr.io/long2know/game-portal
          candidate="$image:sha-$SOURCE_COMMIT"

          umask 077
          auth_dir="$PWD/.ghcr-publish-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -- "$auth_dir"
          trap 'rm -rf -- "$auth_dir"' EXIT
          mkdir -- "$auth_dir/write" "$auth_dir/read"
          # An explicit empty GHCR entry prevents Docker from using its default credential store.
          printf '%s\n' '{"auths":{"ghcr.io":{}}}' > "$auth_dir/read/config.json"
          cp "$auth_dir/read/config.json" "$auth_dir/write/config.json"
          printf '%s\n' "$GHCR_TOKEN" | docker --config "$auth_dir/write" login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin
          unset GHCR_TOKEN
          docker --config "$auth_dir/write" image push "$candidate"

          registry_digest() {
            docker --config "$auth_dir/$1" buildx imagetools inspect --format '{{.Manifest.Digest}}' "$2"
          }
          digest=$(registry_digest write "$candidate")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker --config "$auth_dir/write" image pull --platform linux/amd64 "$image@$digest"
          if [[ "$(docker image inspect --format '{{.Id}}' "$image@$digest")" != "$TESTED_IMAGE_ID" ]]; then
            echo "Registry image $image@$digest does not match the smoke-tested image." >&2
            exit 1
          fi

          main_commit=$(current_main)
          if [[ "$main_commit" != "$SOURCE_COMMIT" ]]; then
            echo "Skipping latest promotion: main is now $main_commit."
            exit 0
          fi
          docker --config "$auth_dir/write" buildx imagetools create --prefer-index=false \
            --tag "$image:latest" "$image@$digest"
          latest_digest=$(registry_digest write "$image:latest")
          [[ "$latest_digest" == "$digest" ]]
          echo "Verified authenticated $candidate and $image:latest at $image@$digest ($TESTED_IMAGE_ID)"

          # GHCR denies the anonymous token request for a private package even after authenticated promotion.
          status=$(curl --disable --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' \
            --get --data-urlencode 'service=ghcr.io' --data-urlencode 'scope=repository:long2know/game-portal:pull' \
            https://ghcr.io/token)
          case "$status" in
            401|403)
              echo 'visibility=private' >> "$GITHUB_OUTPUT"
              echo "::notice::GHCR denied anonymous access (HTTP $status); latest is verified with credentials only."
              printf 'GHCR `%s:latest` is **not anonymously pullable** (HTTP %s). Authenticated digest: `%s`.\n' \
                "$image" "$status" "$digest" >> "$GITHUB_STEP_SUMMARY"
              ;;
            200)
              [[ "$(registry_digest read "$candidate")" == "$digest" ]]
              [[ "$(registry_digest read "$image:latest")" == "$digest" ]]
              docker --config "$auth_dir/read" image pull --platform linux/amd64 "$image:latest"
              [[ "$(docker image inspect --format '{{.Id}}' "$image:latest")" == "$TESTED_IMAGE_ID" ]]
              echo 'visibility=public' >> "$GITHUB_OUTPUT"
              printf 'Verified anonymous pull of `%s:latest` at `%s` (config ID `%s`).\n' \
                "$image" "$digest" "$TESTED_IMAGE_ID" | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "Cannot establish anonymous GHCR visibility (HTTP $status)." >&2
              exit 1
              ;;
          esac

  public-archive:
    name: Provide a verified no-login image archive
    needs: [application, image, publish]
    if: >-
      !cancelled() && needs.application.result == 'success' && needs.image.result == 'success' &&
      (needs.publish.result == 'failure' || needs.publish.outputs.visibility == 'private') &&
      github.event_name == 'push' && github.server_url == 'https://github.com' &&
      github.repository == 'long2know/game-portal' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: public-archive-game-portal-${{ github.sha }}
      queue: max
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.image.outputs.artifact_id }}
          path: release-image/
      - name: Validate the exact tested image archive
        env:
          TESTED_IMAGE_ID: ${{ needs.image.outputs.image_id }}
        run: bash scripts/smoke-image-archive.sh load release-image "$TESTED_IMAGE_ID" "$SOURCE_COMMIT"
      - name: Attach checksummed bytes to a build-specific prerelease
        working-directory: release-image
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_IMAGE_ID: ${{ needs.image.outputs.image_id }}
          TAG: ${{ needs.image.outputs.archive_tag }}
        run: |
          set -euo pipefail
          repo=long2know/game-portal
          [[ "$GITHUB_SERVER_URL" == https://github.com && "$GITHUB_REPOSITORY" == "$repo" &&
            "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main && "$SOURCE_COMMIT" == "$GITHUB_SHA" ]]
          [[ "$TAG" =~ ^portal-image-$SOURCE_COMMIT-$GITHUB_RUN_ID-[1-9][0-9]*$ ]]
          current_main() {
            GIT_TERMINAL_PROMPT=0 git -c credential.helper= ls-remote --exit-code \
              https://github.com/long2know/game-portal.git refs/heads/main | cut -f1
          }
          if [[ "$(current_main)" != "$SOURCE_COMMIT" ]]; then
            echo 'Skipping the archive for a stale main commit.'
            exit 0
          fi

          # Never move an existing tag or publish a different build under the same release.
          ref="refs/tags/$TAG"
          existing=$(gh api "repos/$repo/git/matching-refs/tags/$TAG" \
            | jq -r --arg ref "$ref" '.[] | select(.ref == $ref) | .object.sha')
          if [[ -z "$existing" ]]; then
            gh api --method POST "repos/$repo/git/refs" -f ref="$ref" -f sha="$SOURCE_COMMIT" --silent
          elif [[ "$existing" != "$SOURCE_COMMIT" ]]; then
            echo "Refusing to use $ref, which points to $existing." >&2
            exit 1
          fi
          verify_tag() {
            gh api "repos/$repo/git/ref/tags/$TAG" | jq -e --arg sha "$SOURCE_COMMIT" \
              '.object.type == "commit" and .object.sha == $sha' >/dev/null
          }
          verify_tag

          notes=$(printf 'Smoke-tested Jade Court Linux/amd64 image.\n\n- Source commit: `%s`\n- Tested image ID: `%s`\n- CI run: https://github.com/%s/actions/runs/%s\n\nVerify the attached SHA-256 before `docker load`. Deployment: https://github.com/%s/blob/%s/docs/operations.md' \
            "$SOURCE_COMMIT" "$TESTED_IMAGE_ID" "$repo" "$GITHUB_RUN_ID" "$repo" "$SOURCE_COMMIT")
          get_release() {
            gh api --paginate --slurp "repos/$repo/releases?per_page=100" | jq -c --arg tag "$TAG" \
              '[.[][] | select(.tag_name == $tag)] | if length == 0 then empty elif length == 1 then .[0] else error("duplicate tag") end'
          }
          release=$(get_release)
          if [[ -z "$release" ]]; then
            gh release create "$TAG" --repo "$repo" --verify-tag --draft --prerelease --latest=false \
              --title "Jade Court image $TAG" --notes "$notes"
            release=$(get_release)
          fi
          jq -e --arg notes "$notes" '.prerelease and .body == $notes' <<< "$release" >/dev/null
          release_id=$(jq -er '.id' <<< "$release")
          draft=$(jq -r '.draft' <<< "$release")
          archive=game-portal-linux-amd64.tar.gz

          for file in "$archive" "$archive.sha256"; do
            sum=$(sha256sum -- "$file" | cut -d ' ' -f1)
            asset=$(gh api "repos/$repo/releases/$release_id/assets" | jq -c --arg file "$file" \
              '.[] | select(.name == $file)')
            if [[ -z "$asset" && "$draft" == true ]]; then
              gh release upload "$TAG" "$file" --repo "$repo"
              asset=$(gh api "repos/$repo/releases/$release_id/assets" | jq -c --arg file "$file" \
                '.[] | select(.name == $file)')
            fi
            jq -e --arg digest "sha256:$sum" '.state == "uploaded" and .digest == $digest' <<< "$asset" >/dev/null
          done

          if [[ "$draft" == true ]]; then
            if [[ "$(current_main)" != "$SOURCE_COMMIT" ]]; then
              echo 'Main moved; leaving the verified assets on an unpublished draft.'
              exit 0
            fi
            verify_tag
            gh release edit "$TAG" --repo "$repo" --draft=false --latest=false
          fi

          url="https://github.com/$repo/releases/download/$TAG/$archive"
          public_sum=$(curl --disable --location --fail --silent --show-error --retry 3 --max-time 120 "$url.sha256")
          [[ "$public_sum" == "$(cat "$archive.sha256")" ]]
          download_sum=$(curl --disable --location --fail --silent --show-error --retry 3 --max-time 240 "$url" | sha256sum)
          [[ "${download_sum%% *}" == "${public_sum%% *}" ]]
          printf 'Verified anonymous download of the [tested image archive](%s) (config ID `%s`).\n' \
            "$url" "$TESTED_IMAGE_ID" | tee -a "$GITHUB_STEP_SUMMARY"
